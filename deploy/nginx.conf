# 记账本 · Nginx 反向代理（放在 /etc/nginx/conf.d/keep-accounts.conf）
# 证书用 certbot 申请后会自动填好下面两行路径：
#   sudo certbot --nginx -d ledger.example.com
#
# 注意：nginx >= 1.25 用 `listen 443 ssl;` + `http2 on;`；
#       旧版本用 `listen 443 ssl http2;`（二者不要同时写）。

server {
    listen 80;
    listen [::]:80;
    server_name ledger.example.com;

    # 国内服务器用域名对外提供服务需要 ICP 备案；未备案先用 IP 访问
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ledger.example.com;

    ssl_certificate     /etc/letsencrypt/live/ledger.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ledger.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # 语音上传：服务端上限 25MB，这里留点余量
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大模型解析可能慢，别让 Nginx 提前断开
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering       off;
    }
}
